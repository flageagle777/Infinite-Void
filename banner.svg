<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Infinite Void banner">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1b1b1b"/>
      <stop offset="55%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#f3efe8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="310" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="120" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="250" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="55" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="40" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="270" r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="110" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="320" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1190" cy="70" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="210" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="190" r="1" ><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="215" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="35" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- black hole group, centered -->
  <g transform="translate(640 165)">
    <!-- soft whitish halo -->
    <circle r="250" fill="url(#halo)"/>

    <!-- swirling spiral arms (rotating) -->
    <g fill="none" stroke="#f7f3ec" stroke-linecap="round" filter="url(#glow)">
      <circle r="112" stroke-width="3" stroke-opacity="0.75" stroke-dasharray="150 554">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="140" stroke-width="2.5" stroke-opacity="0.55" stroke-dasharray="210 670">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="172" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="280 800">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle r="205" stroke-width="1.5" stroke-opacity="0.28" stroke-dasharray="120 1170">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- accretion ring glow -->
    <circle r="92" fill="none" stroke="#fffaf0" stroke-width="14" opacity="0.55" filter="url(#soft)"/>
    <circle r="92" fill="none" stroke="#fffdf8" stroke-width="5" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- the black hole -->
    <circle r="82" fill="#000000"/>
  </g>

  <!-- title -->
  <text x="640" y="345" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="16" fill="#f5f2ee">INFINITE VOID</text>
  <text x="640" y="378" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" letter-spacing="5" fill="#8f8f8f">CROSS YOUR FINGERS · OPEN THE VOID</text>
</svg>
